id = "branrgx/background-apps"
name = "Background Apps"
version = "0.1.0"
plugin_api = 24
author = "branrgx"
license = "MIT"
icon = "applications-system"
description = "Shows applications running in the background."
tags = ["background", "apps", "flatpak"]

dependencies = ["gdbus", "flatpak"]

[[service]]
id = "monitor"
entry = "service.luau"

[[widget]]
id = "apps"
entry = "widget.luau"

[[widget.setting]]
key = "glyph"
type = "glyph"
label_key = "settings.glyph.label"
default = "ghost"

[[panel]]
id = "list"
entry = "panel.luau"
width = 340
height = 360
placement = "floating"
open_near_click = true
